<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데모 스토어 · 장바구니</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <p class="tag">데모 스토어 (샘플 웹앱)</p>
  <h1>장바구니</h1>
  <ul class="cart">
    <li><span>차량용 무선 충전 거치대</span><b>39,000원</b></li>
    <li><span>트렁크 정리함</span><b>24,000원</b></li>
  </ul>
  <div class="total"><span>합계</span><b id="total">63,000원</b></div>
  <button id="pay-button" class="pay" type="button">결제하기</button>
  <p id="status" class="status" role="status">결제 전</p>
</main>
<script src="app.js"></script>
</body>
</html>
